jenkins:
  systemMessage: "ShopEase release lab"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin123"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "http://localhost:8080/"
credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "notify-token"
              secret: "shopease-notify-secret-123"
              description: "Token the pipeline sends to the notification service"
jobs:
  - script: |
      pipelineJob('shopease-order-service') {
        definition {
          cpsScm {
            scm {
              git {
                remote { url('/var/shopease-repo') }
                branch('*/main')
              }
            }
            scriptPath('Jenkinsfile')
          }
        }
      }
EOF

cat > docker-compose.yml <<'EOF'
services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/casc/casc.yaml
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./app:/var/shopease-repo:ro
      - ./casc.yaml:/casc/casc.yaml:ro
    networks:
      - shopease-net

  notify-receiver:
    image: python:3.12-alpine
    container_name: notify-receiver
    command: python -u /app/receiver.py
    ports:
      - "9000:9000"
    volumes:
      - ./receiver:/app:ro
    networks:
      - shopease-net

volumes:
  jenkins_home:

networks:
  shopease-net:
    name: shopease-net